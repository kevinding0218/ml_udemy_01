<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Predictor</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f6fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #e1e7f0;
        border-radius: 16px;
        background: white;
        box-shadow: 0 16px 40px rgb(23 32 51 / 8%);
      }

      h1 { margin: 0 0 8px; font-size: 1.65rem; }
      .intro { margin: 0 0 24px; color: #58657a; line-height: 1.5; }

      form { display: grid; gap: 16px; }

      label { display: grid; gap: 7px; font-weight: 600; }

      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd4e1;
        border-radius: 8px;
        font: inherit;
      }

      input:focus {
        outline: 3px solid rgb(48 104 210 / 20%);
        border-color: #3068d2;
      }

      button {
        margin-top: 4px;
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: #245bc0;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover { background: #19499f; }
      button:disabled { opacity: 0.65; cursor: wait; }

      #result {
        margin-top: 20px;
        padding: 14px;
        border-radius: 8px;
        background: #eef4ff;
        line-height: 1.5;
      }

      #result[hidden] { display: none; }
      #result.error { color: #9c2525; background: #fff0f0; }
      #outcome { margin: 0; font-weight: 700; }
      #probability { margin: 4px 0 0; color: #46536a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Purchase Predictor</h1>
      <p class="intro">Enter a customer's age and salary to estimate whether they will make a purchase.</p>
      <form id="prediction-form">
        <label for="age">
          Age
          <input id="age" name="age" type="number" min="0" step="any" required>
        </label>
        <label for="salary">
          Salary
          <input id="salary" name="salary" type="number" min="0" step="any" required>
        </label>
        <button id="submit-button" type="submit">Predict purchase</button>
      </form>
      <section id="result" aria-live="polite" hidden>
        <p id="outcome"></p>
        <p id="probability"></p>
      </section>
    </main>
    <script>
      const form = document.querySelector("#prediction-form");
      const button = document.querySelector("#submit-button");
      const result = document.querySelector("#result");
      const outcome = document.querySelector("#outcome");
      const probability = document.querySelector("#probability");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.hidden = true;
        result.classList.remove("error");
        button.disabled = true;
        button.textContent = "Predicting…";

        try {
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              age: Number(form.elements.age.value),
              salary: Number(form.elements.salary.value),
            }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Prediction request failed.");
          }

          outcome.textContent = data.will_purchase
            ? "Prediction: This customer will make a purchase."
            : "Prediction: This customer will not make a purchase.";
          probability.textContent =
            `Estimated purchase probability: ${(data.purchase_probability * 100).toFixed(1)}%`;
        } catch (error) {
          result.classList.add("error");
          outcome.textContent = error.message || "Could not connect to the prediction API.";
          probability.textContent = "";
        } finally {
          result.hidden = false;
          button.disabled = false;
          button.textContent = "Predict purchase";
        }
      });
    </script>
  </body>
</html>
