<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Similarity Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      color: #c8a8ff;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 36px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tab {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #444;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab.active {
      background: #6c3af5;
      border-color: #6c3af5;
      color: #fff;
    }

    .search-box {
      max-width: 600px;
      margin: 0 auto 32px;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus { border-color: #6c3af5; }

    .search-box button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background: #6c3af5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover { background: #8a5cf5; }
    .search-box button:disabled { background: #444; cursor: not-allowed; }

    .panel { display: none; }
    .panel.active { display: block; }

    .status {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      min-height: 24px;
      margin-bottom: 16px;
    }

    .status.error { color: #ff6b6b; }

    .results {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a45;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: #6c3af5; }

    .card-rank {
      font-size: 1.5rem;
      font-weight: bold;
      color: #6c3af5;
      min-width: 32px;
    }

    .card-img {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      background: #2a2a45;
      flex-shrink: 0;
    }

    .card-img-placeholder {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      background: #2a2a45;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .card-body { flex: 1; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-id {
      font-size: 0.8rem;
      color: #888;
      font-family: monospace;
    }

    .score {
      font-size: 0.85rem;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 12px;
    }

    .score-high  { background: #1a3a1a; color: #6fcf6f; }
    .score-mid   { background: #3a2a1a; color: #f0a050; }
    .score-low   { background: #2a1a1a; color: #cf6f6f; }

    .card-desc {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 8px;
      color: #ccc;
    }

    .aspects {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .aspect {
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 12px;
      background: #2a2a45;
      color: #aaa;
    }

    .release {
      font-size: 0.75rem;
      color: #666;
      margin-top: 8px;
    }

    .empty {
      text-align: center;
      color: #555;
      padding: 40px;
    }
  </style>
</head>
<body>

  <h1>Card Similarity Search</h1>
  <p class="subtitle">Powered by CLIP — search by description or image URL</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('text')">Text Search</button>
    <button class="tab" onclick="switchTab('image')">Image Search</button>
  </div>

  <!-- Text search panel -->
  <div id="panel-text" class="panel active">
    <div class="search-box">
      <input id="text-input" type="text" placeholder='e.g. "a fire breathing creature"' />
      <button id="text-btn" onclick="searchText()">Search</button>
    </div>
  </div>

  <!-- Image search panel -->
  <div id="panel-image" class="panel">
    <div class="search-box">
      <input id="image-input" type="text" placeholder="Paste an image URL..." />
      <button id="image-btn" onclick="searchImage()">Search</button>
    </div>
  </div>

  <div id="status" class="status"></div>
  <div id="results" class="results"></div>

  <script>
    const API = "http://localhost:8005";

    function switchTab(tab) {
      document.querySelectorAll(".tab").forEach((t, i) => {
        t.classList.toggle("active", ["text","image"][i] === tab);
      });
      document.getElementById("panel-text").classList.toggle("active", tab === "text");
      document.getElementById("panel-image").classList.toggle("active", tab === "image");
      setStatus(""); renderResults([]);
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = "status" + (isError ? " error" : "");
    }

    function scoreClass(s) {
      if (s >= 0.78) return "score-high";
      if (s >= 0.74) return "score-mid";
      return "score-low";
    }

    function renderResults(results) {
      const el = document.getElementById("results");
      if (!results.length) { el.innerHTML = ""; return; }

      el.innerHTML = results.map((r, i) => {
        const img = r.imageUrl
          ? `<img class="card-img" src="${r.imageUrl}" alt="${r.cardId}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="card-img-placeholder" style="display:none">🃏</div>`
          : `<div class="card-img-placeholder">🃏</div>`;
        const aspects = (r.aspects || []).map(a => `<span class="aspect">${a}</span>`).join("");
        const sc = r.score.toFixed(4);
        return `
          <div class="card">
            <div class="card-rank">#${i + 1}</div>
            ${img}
            <div class="card-body">
              <div class="card-header">
                <span class="card-id">${r.cardId}</span>
                <span class="score ${scoreClass(r.score)}">${sc}</span>
              </div>
              <p class="card-desc">${r.description}</p>
              <div class="aspects">${aspects}</div>
              <div class="release">${r.releaseId} · ${r.releaseDate}</div>
            </div>
          </div>`;
      }).join("");
    }

    async function searchText() {
      const query = document.getElementById("text-input").value.trim();
      if (!query) { setStatus("Enter a description to search.", true); return; }

      const btn = document.getElementById("text-btn");
      btn.disabled = true;
      setStatus("Searching…");
      renderResults([]);

      try {
        const res = await fetch(`${API}/search/text`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, top_k: 3 })
        });
        const data = await res.json();
        if (!res.ok) { setStatus(data.error || "API error.", true); return; }
        setStatus(`Top ${data.results.length} results for "${data.query}"`);
        renderResults(data.results);
      } catch (e) {
        setStatus("Could not reach API at localhost:8005 — is the server running?", true);
      } finally {
        btn.disabled = false;
      }
    }

    async function searchImage() {
      const url = document.getElementById("image-input").value.trim();
      if (!url) { setStatus("Paste an image URL to search.", true); return; }

      const btn = document.getElementById("image-btn");
      btn.disabled = true;
      setStatus("Encoding image…");
      renderResults([]);

      try {
        const res = await fetch(`${API}/search/image`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image_url: url, top_k: 3 })
        });
        const data = await res.json();
        if (!res.ok) { setStatus(data.error || "API error.", true); return; }
        setStatus(`Top ${data.results.length} results for image query`);
        renderResults(data.results);
      } catch (e) {
        setStatus("Could not reach API at localhost:8005 — is the server running?", true);
      } finally {
        btn.disabled = false;
      }
    }

    // Allow Enter key to trigger search
    document.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      if (document.getElementById("panel-text").classList.contains("active")) searchText();
      else searchImage();
    });
  </script>

</body>
</html>
