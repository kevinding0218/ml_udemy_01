<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Estimate purchase likelihood from age and salary.">
    <title>Customer Purchase Predictor</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f6fb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #e1e7f0;
        border-radius: 16px;
        background: white;
        box-shadow: 0 16px 40px rgb(23 32 51 / 8%);
      }

      h1 { margin: 0 0 8px; font-size: 1.65rem; }
      .intro { margin: 0 0 24px; color: #58657a; line-height: 1.5; }
      form { display: grid; gap: 16px; }
      label { display: grid; gap: 7px; font-weight: 600; }

      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd4e1;
        border-radius: 8px;
        font: inherit;
      }

      input:focus {
        outline: 3px solid rgb(48 104 210 / 20%);
        border-color: #3068d2;
      }

      button {
        margin-top: 4px;
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: #245bc0;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover { background: #19499f; }

      #result {
        margin-top: 20px;
        padding: 14px;
        border-radius: 8px;
        background: #eef4ff;
        line-height: 1.5;
      }

      #result[hidden] { display: none; }
      #result.error { color: #9c2525; background: #fff0f0; }
      #outcome { margin: 0; font-weight: 700; }
      #probability { margin: 4px 0 0; color: #46536a; }
      .note { margin: 20px 0 0; color: #68758a; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Customer Purchase Predictor</h1>
      <p class="intro">Enter a customer's age and salary to estimate purchase likelihood.</p>
      <form id="prediction-form">
        <label for="age">
          Age
          <input id="age" name="age" type="number" min="0" step="any" required>
        </label>
        <label for="salary">
          Salary
          <input id="salary" name="salary" type="number" min="0" step="any" required>
        </label>
        <button id="submit-button" type="submit">Predict purchase</button>
      </form>
      <section id="result" aria-live="polite" hidden>
        <p id="outcome"></p>
        <p id="probability"></p>
      </section>
      <p class="note">Predictions run in your browser; form inputs are not sent to a server.</p>
    </main>
    <script>
      const form = document.querySelector("#prediction-form");
      const result = document.querySelector("#result");
      const outcome = document.querySelector("#outcome");
      const probability = document.querySelector("#probability");
      let model;

      async function loadModel() {
        const response = await fetch(new URL("model.json", window.location.href));
        if (!response.ok) throw new Error("Could not load the prediction model.");
        model = await response.json();
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        result.hidden = true;
        result.classList.remove("error");

        if (!model) {
          result.classList.add("error");
          outcome.textContent = "The model is still loading. Please try again.";
          probability.textContent = "";
          result.hidden = false;
          return;
        }

        const values = [Number(form.elements.age.value), Number(form.elements.salary.value)];
        const score = model.intercept + values.reduce(
          (sum, value, index) =>
            sum + ((value - model.means[index]) / model.scales[index]) * model.coefficients[index],
          0,
        );
        const purchaseProbability = 1 / (1 + Math.exp(-score));
        const willPurchase = purchaseProbability >= 0.5;

        outcome.textContent = willPurchase
          ? "Prediction: This customer will make a purchase."
          : "Prediction: This customer will not make a purchase.";
        probability.textContent =
          `Estimated purchase probability: ${(purchaseProbability * 100).toFixed(1)}%`;
        result.hidden = false;
      });

      loadModel().catch((error) => {
        result.classList.add("error");
        outcome.textContent = error.message;
        probability.textContent = "";
        result.hidden = false;
      });
    </script>
  </body>
</html>
